[build]
  command = "node scripts/validate-customer-surfaces.mjs"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "http://zeni.aneurinadvisory.com/*"
  to = "https://zeni.business/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://zeni.aneurinadvisory.com/*"
  to = "https://zeni.business/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"

