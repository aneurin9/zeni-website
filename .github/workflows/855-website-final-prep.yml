name: "#855 website final prep"

on:
  push:
    branches:
      - programme/855-website-final-prep-20261025
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-release-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Validate policy alignment and release redirects
        run: node scripts/validate-855-website-final-prep.mjs
