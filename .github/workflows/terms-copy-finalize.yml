name: Finalize Terms copy

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terms-premium-copy
          fetch-depth: 0

      - name: Finalize Terms copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('terms/index.html')
          text = path.read_text()

          text = re.sub(r'\bPro Tier\b', 'Premium Tier', text)
          text = re.sub(r'\bPro tier\b', 'Premium tier', text)
          text = re.sub(r'\bPro Services\b', 'Premium Services', text)
          text = re.sub(r'\bPro services\b', 'Premium services', text)
          text = re.sub(r'\bPro filing\b', 'Premium filing', text)
          text = re.sub(r'\bPro subscription\b', 'Premium subscription', text)
          text = re.sub(
              r'including Canada,\s*the United States,\s*or Trinidad and Tobago\.',
              'including Canada or the United States.',
              text,
          )

          if re.search(r'\bPro (?:Tier|tier|Services|services|filing|subscription)\b', text):
              raise SystemExit('A legacy Pro plan reference remains in the Terms page')
          if 'Trinidad and Tobago' in text:
              raise SystemExit('Trinidad and Tobago remains in the Terms page')
          if 'including Canada or the United States.' not in text:
              raise SystemExit('Updated licensing disclaimer is missing')

          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/terms-copy-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terms/index.html .github/workflows/terms-copy-finalize.yml
          git commit -m "Finish Premium naming in Terms"
          git push origin HEAD:agent/terms-premium-copy
