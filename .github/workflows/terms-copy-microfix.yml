name: Terms copy micro-fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/terms-premium-copy
          fetch-depth: 0

      - name: Update Terms copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('terms/index.html')
          text = path.read_text()

          replacements = {
              'Zeni Pro Tier': 'Zeni Premium Tier',
              'Zeni Pro tier': 'Zeni Premium tier',
              'Pro tier subscribers': 'Premium tier subscribers',
              'Pro tier services': 'Premium tier services',
              'Pro services': 'Premium services',
              'Pro filing': 'Premium filing',
              'Pro subscription fees': 'Premium subscription fees',
              'Canada, the United States, or Trinidad and Tobago': 'Canada or the United States',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          forbidden = [
              'Zeni Pro',
              'Pro tier',
              'Pro services',
              'Pro filing',
              'Pro subscription',
              'Trinidad and Tobago',
          ]
          for value in forbidden:
              if value in text:
                  raise SystemExit(f'Forbidden legacy Terms text remains: {value}')

          required = [
              'Zeni Premium Tier — Specific Terms and Limitations',
              'The Zeni Premium tier includes',
              'Premium tier subscribers',
              'Premium tier services',
              'Premium services',
              'Premium filing',
              'Premium subscription fees',
              'including Canada or the United States.',
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f'Required updated Terms text is missing: {value}')

          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/terms-copy-microfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terms/index.html .github/workflows/terms-copy-microfix.yml
          git commit -m "Align Terms with Premium plan naming"
          git push origin HEAD:agent/terms-premium-copy
