name: Apply paid onboarding index patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/apply-paid-onboarding-index.py'
      - '.github/workflows/apply-paid-onboarding-index.yml'
      - 'paid-checkout.js'
      - 'api/checkout.js'

permissions:
  contents: write

concurrency:
  group: paid-onboarding-index-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'build/automatic-paid-onboarding-website' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/automatic-paid-onboarding-website
          fetch-depth: 0

      - name: Apply guarded index patch
        run: python scripts/apply-paid-onboarding-index.py

      - name: Validate checkout JavaScript
        run: |
          node --check api/checkout.js
          node --check paid-checkout.js

      - name: Commit patched index once
        shell: bash
        run: |
          set -euo pipefail
          target='index.html'
          if git diff --quiet -- "$target"; then
            echo 'Index patch already committed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Connect website intake to secure Checkout'
          git push origin HEAD:build/automatic-paid-onboarding-website
