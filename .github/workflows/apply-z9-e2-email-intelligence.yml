name: Apply Z9-E2 Email Intelligence website patches

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/apply-z9-e2-email-intelligence.py'
      - '.github/workflows/apply-z9-e2-email-intelligence.yml'
      - 'index.html'
      - 'privacy/index.html'
      - 'terms/index.html'

permissions:
  contents: write

concurrency:
  group: z9-e2-email-intelligence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/adopt-z9-e2-public-email-intelligence-copy-20260730' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adopt-z9-e2-public-email-intelligence-copy-20260730
          fetch-depth: 0

      - name: Apply guarded website and legal patches
        run: python scripts/apply-z9-e2-email-intelligence.py

      - name: Validate generated wording boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('index.html').read_text()
          privacy = ' '.join(Path('privacy/index.html').read_text().split())
          terms = ' '.join(Path('terms/index.html').read_text().split())

          required_home = (
              '<!-- Z9-E2 Email Intelligence capability -->',
              'Your business inbox stops becoming another job.',
              'Important messages become clear next steps—without leaving WhatsApp.',
              'Works with the business email Zeni helps you set up.',
          )
          required_privacy = (
              '<!-- Z9-E2 Email Intelligence privacy -->',
              'Raw message bodies and attachment files are not stored permanently by default.',
              'Email messages and attachments are treated as untrusted evidence.',
              'requires confirmation through WhatsApp',
              'does not delete or change email in Zoho',
          )
          required_terms = (
              '<!-- Z9-E2 Email Intelligence terms -->',
              'optional read-only integration with Zoho Mail',
              'cannot authorize a payment',
              'does not guarantee that every important message will be identified',
          )

          for value in required_home:
              if value not in home:
                  raise SystemExit(f'Homepage boundary missing: {value}')
          for value in required_privacy:
              if value not in privacy:
                  raise SystemExit(f'Privacy boundary missing: {value}')
          for value in required_terms:
              if value not in terms:
                  raise SystemExit(f'Terms boundary missing: {value}')
          if 'Connect Zoho Mail with read-only access' in home:
              raise SystemExit('Homepage uses prohibited technical lead wording')
          if '<summary>Email Intelligence' in home:
              raise SystemExit('Email Intelligence FAQ is not permitted')
          PY

      - name: Commit generated website files once
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html privacy/index.html terms/index.html; then
            echo 'Z9-E2 website patches already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html privacy/index.html terms/index.html
          git commit -m 'Apply approved Email Intelligence website wording'
          git push origin HEAD:agent/adopt-z9-e2-public-email-intelligence-copy-20260730
