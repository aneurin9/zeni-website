name: Apply live-test website polish

on:
  push:
    branches:
      - fix/live-test-mobile-and-welcome-polish
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-test-mobile-and-welcome-polish
          fetch-depth: 0

      - name: Apply focused website changes
        run: python scripts/apply-live-test-polish.py

      - name: Validate and commit clean result
        run: |
          rm scripts/apply-live-test-polish.py
          rm .github/workflows/apply-live-test-polish.yml
          git diff --check
          git diff -- index.html premium/index.html welcome/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html premium/index.html welcome/index.html scripts/apply-live-test-polish.py .github/workflows/apply-live-test-polish.yml
          git commit -m "Polish mobile walkthrough and welcome page"
          git push origin HEAD:fix/live-test-mobile-and-welcome-polish
