name: Website validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/website-validation.yml'

permissions:
  contents: read

jobs:
  runner-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner starts
        run: echo runner-ready
