name: Website validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'index.html'
      - 'welcome/index.html'
      - 'welcome/welcome.js'
      - 'paid-checkout.js'
      - 'api/checkout.js'
      - 'api/welcome.js'
      - 'scripts/apply-paid-onboarding-index.py'
      - 'scripts/apply-z9-e2-email-intelligence.py'
      - '.github/workflows/website-validation.yml'
      - '.github/workflows/apply-paid-onboarding-index.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply guarded integration in validation workspace
        run: python scripts/apply-paid-onboarding-index.py

      - name: Apply guarded Z9-E2 wording in validation workspace
        id: z9_apply
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/apply-z9-e2-email-intelligence.py > >(tee z9-e2-validation.log) 2>&1
          status=$?
          echo "apply_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate JavaScript syntax
        run: |
          node --check paid-checkout.js
          node --check api/checkout.js
          node --check api/welcome.js
          node --check welcome/welcome.js

      - name: Validate paid checkout integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<script src="/paid-checkout.js"></script>' index.html
          grep -q "fetch('/api/checkout'" paid-checkout.js
          grep -q 'Opening secure checkout' paid-checkout.js
          grep -q "url.hostname === 'checkout.stripe.com'" paid-checkout.js
          grep -q 'cryptoApi.getRandomValues' paid-checkout.js
          grep -q 'window.runPaidCheckout' paid-checkout.js
          grep -q 'ZENI_BACKEND_CHECKOUT_URL' api/checkout.js
          grep -q 'ZENI_CHECKOUT_BRIDGE_SECRET' api/checkout.js
          grep -q "LEGACY_BACKEND_CHECKOUT_PATH = '/api/public/checkout'" api/checkout.js
          grep -q "CONFIGURED_BACKEND_CHECKOUT_PATH = '/api/public/configured-checkout'" api/checkout.js
          grep -q 'url.pathname = CONFIGURED_BACKEND_CHECKOUT_PATH' api/checkout.js
          grep -q "'Origin': requestOrigin" api/checkout.js
          grep -q 'allowedRequestOrigin(req)' api/checkout.js
          grep -q "req.headers\['x-vercel-forwarded-for'\]" api/checkout.js
          grep -q 'X-Zeni-Checkout-Timestamp' api/checkout.js
          grep -q 'X-Zeni-Client-IP-Hash' api/checkout.js
          grep -q 'X-Zeni-Checkout-Signature' api/checkout.js
          grep -q "createHmac('sha256'" api/checkout.js
          ! grep -q 'Math.random' paid-checkout.js
          ! grep -q "'X-Forwarded-For':" api/checkout.js
          ! grep -q 'stripe-pricing-table' index.html
          ! grep -q 'pricing-table.js' index.html
          ! grep -q 'id="stripe-modal"' index.html
          ! grep -q 'function openStripe()' index.html
          ! grep -q 'openStripe();' index.html
          ! grep -q 'ZENI_BACKEND_CHECKOUT_URL' paid-checkout.js
          ! grep -q 'ZENI_CHECKOUT_BRIDGE_SECRET' paid-checkout.js index.html

      - name: Verify customer flow and secret boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q "var GS_STEP_LABELS = \['Name','Province','WhatsApp','Plan'\]" index.html
          grep -q 'function gsGreeting()' index.html
          grep -q 'gsRunCheckout();' index.html
          grep -q "openGetStarted('core')" index.html
          grep -q "openGetStarted('premium')" index.html
          grep -q 'https://wa.me/16475601842?text=Hi%20Zeni' welcome/index.html
          grep -q 'id="welcome-title"' welcome/index.html
          grep -q '<script src="/welcome/welcome.js"></script>' welcome/index.html
          grep -q "fetch('/api/welcome?checkout_session_id='" welcome/welcome.js
          grep -q 'history.replaceState' welcome/welcome.js
          grep -q 'function alignFirstMessagePreview()' welcome/welcome.js
          grep -q 'I’ll help you build and run your business, one clear step at a time.' welcome/welcome.js
          grep -q 'How would you like to get started?' welcome/welcome.js
          grep -q "title: 'Recommended: Walkthrough'" welcome/welcome.js
          grep -q "title: 'Grow my business'" welcome/welcome.js
          grep -q "description: 'I’ll help you build the right foundation'" welcome/welcome.js
          grep -q "description: 'I’ll learn how it works and help you move it forward'" welcome/welcome.js
          grep -q "description: 'We’ll think it through, step by step'" welcome/welcome.js
          ! grep -q 'item.remove()' welcome/welcome.js
          grep -q "BACKEND_WELCOME_PATH = '/api/public/welcome'" api/welcome.js
          grep -q 'X-Zeni-Welcome-Timestamp' api/welcome.js
          grep -q 'X-Zeni-Welcome-Signature' api/welcome.js
          grep -q "createHmac('sha256'" api/welcome.js
          ! grep -Eq 'STRIPE_SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY|STRIPE_PRICE_TIER' index.html paid-checkout.js welcome/index.html welcome/welcome.js

      - name: Validate Z9-E2 outcome and legal wording
        id: z9_validate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - <<'PY' >> z9-e2-validation.log 2>&1
          from pathlib import Path

          home = Path('index.html').read_text()
          privacy = ' '.join(Path('privacy/index.html').read_text().split())
          terms = ' '.join(Path('terms/index.html').read_text().split())

          required_home = (
              '<!-- Z9-E2 Email Intelligence capability -->',
              'Your business inbox stops becoming another job.',
              'Important messages become clear next steps—without leaving WhatsApp.',
              'Works with the business email Zeni helps you set up.',
          )
          required_privacy = (
              '<!-- Z9-E2 Email Intelligence privacy -->',
              'Raw message bodies and attachment files are not stored permanently by default.',
              'Email messages and attachments are treated as untrusted evidence.',
              'requires confirmation through WhatsApp',
              'does not delete or change email in Zoho',
          )
          required_terms = (
              '<!-- Z9-E2 Email Intelligence terms -->',
              'optional read-only integration with Zoho Mail',
              'cannot authorize a payment',
              'does not guarantee that every important message will be identified',
          )

          for value in required_home:
              if value not in home:
                  raise SystemExit(f'Homepage boundary missing: {value}')
          for value in required_privacy:
              if value not in privacy:
                  raise SystemExit(f'Privacy boundary missing: {value}')
          for value in required_terms:
              if value not in terms:
                  raise SystemExit(f'Terms boundary missing: {value}')
          if 'Connect Zoho Mail with read-only access' in home:
              raise SystemExit('Homepage uses prohibited technical lead wording')
          if '<summary>Email Intelligence' in home:
              raise SystemExit('Email Intelligence FAQ is not permitted')
          PY
          status=$?
          cat z9-e2-validation.log
          echo "validate_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Z9-E2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z9-e2-validation-${{ github.run_id }}
          path: z9-e2-validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Z9-E2 validation
        if: always()
        shell: bash
        run: |
          apply_status="${{ steps.z9_apply.outputs.apply_status }}"
          validate_status="${{ steps.z9_validate.outputs.validate_status }}"
          if [ -z "$apply_status" ] || [ -z "$validate_status" ]; then
            echo 'Z9-E2 validation did not report both statuses.' >&2
            exit 1
          fi
          if [ "$apply_status" -ne 0 ] || [ "$validate_status" -ne 0 ]; then
            echo "Z9-E2 validation failed: apply=$apply_status validate=$validate_status" >&2
            exit 1
          fi
